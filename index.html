<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Android Extended Screen V2</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">📱 Extended Screen V2</div>
    <div id="status">● Offline</div>
</header>

<main>

    <!-- HOME -->

    <section id="home" class="page active">

        <div class="hero">

            <div class="icon">📱↔️📱</div>

            <h1>Android Extended Screen</h1>

            <p>
                Stream video from one Android device
                to another.
            </p>

            <div class="buttons">

                <button id="hostBtn">
                    🖥️ Host
                </button>

                <button id="viewerBtn">
                    📺 Display
                </button>

            </div>

        </div>

    </section>


    <!-- HOST -->

    <section id="host" class="page">

        <div class="card">

            <h2>🖥️ Host</h2>

            <p>
                Choose a video source and share it
                with the Display device.
            </p>

            <video
                id="localVideo"
                autoplay
                muted
                playsinline>
            </video>

            <div class="buttons">

                <button id="cameraBtn">
                    📷 Camera
                </button>

                <button id="screenBtn">
                    🖥️ Share Screen
                </button>

            </div>

            <h3>Connection Offer</h3>

            <textarea
                id="offer"
                placeholder="Offer will appear here">
            </textarea>

            <button id="copyOffer">
                📋 Copy Offer
            </button>

            <h3>Display Answer</h3>

            <textarea
                id="answerInput"
                placeholder="Paste answer from Display">
            </textarea>

            <button id="connectHost">
                🔗 Connect
            </button>

            <button class="back" id="hostBack">
                ← Back
            </button>

        </div>

    </section>


    <!-- VIEWER -->

    <section id="viewer" class="page">

        <div class="card">

            <h2>📺 Display</h2>

            <p>
                Paste the Host offer below.
            </p>

            <textarea
                id="offerInput"
                placeholder="Paste Host offer">
            </textarea>

            <button id="createAnswer">
                🔗 Connect to Host
            </button>

            <h3>Your Answer</h3>

            <textarea
                id="answer"
                placeholder="Answer will appear here">
            </textarea>

            <button id="copyAnswer">
                📋 Copy Answer
            </button>

            <div class="remote-container">

                <video
                    id="remoteVideo"
                    autoplay
                    playsinline>
                </video>

                <button id="fullscreen">
                    ⛶ Fullscreen
                </button>

            </div>

            <button class="back" id="viewerBack">
                ← Back
            </button>

        </div>

    </section>

</main>

<footer>
    Android Extended Screen V2
</footer>

<script src="script.js"></script>

</body>
</html>
